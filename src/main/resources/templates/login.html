<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion ERPNext</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>

<div class="container d-flex align-items-center justify-content-center min-vh-100">
    <div class="card shadow-sm p-4" style="min-width:350px;max-width:400px;width:100%;">
        <div class="text-center mb-3">
            <i class="fas fa-user-lock fa-3x text-primary mb-2"></i>
            <h2 class="mb-2">ERPNext</h2>
            <p class="text-muted">Connexion</p>
        </div>

        <div class="alert alert-danger" role="alert" th:if="${param.error}"
             th:text="${session.SPRING_SECURITY_LAST_EXCEPTION != null ? session.SPRING_SECURITY_LAST_EXCEPTION.message : 'Identifiants invalides'}">
            Identifiants invalides
        </div>
        <div class="alert alert-info" role="alert" th:if="${param.logout}">Vous êtes déconnecté.</div>
        <div class="alert alert-warning" role="alert" th:if="${param.expired}">Votre session ERPNext a expiré, veuillez vous reconnecter.</div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <input type="text" class="form-control" name="username" placeholder="Nom d'utilisateur"
                       autocomplete="username" required autofocus>
            </div>
            <div class="mb-3">
                <input type="password" class="form-control" name="password" placeholder="Mot de passe"
                       autocomplete="current-password" required>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Se connecter</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
