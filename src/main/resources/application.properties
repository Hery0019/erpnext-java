spring.application.name=erp
server.port=8080

# Thymeleaf : cache actif par défaut (production) ; le profil "dev" le désactive (application-dev.properties)
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=true

# Erreurs : jamais de détails internes vers le client (GlobalExceptionHandler fournit les messages utiles)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# ERPNext — surchargez en production par variable d'environnement (ERPNEXT_BASE_URL=https://...)
erpnext.base-url=http://erpnext.localhost:8000
erpnext.connect-timeout=5s
erpnext.read-timeout=30s
erpnext.page-size=500

# Session utilisateur (porte le cookie sid ERPNext)
server.servlet.session.timeout=30m

# Import CSV : 3 fichiers par requête
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=32MB

# Paie — VALEURS DE TEST : à adapter à la société cible
erp.payroll.default-company=Orinasa SA
erp.payroll.currency-label=MGA

# Paiement des factures d'achat — VALEURS DE TEST : compte et devise selon le plan comptable
erp.payment.naming-series=PE-.YYYY.-
erp.payment.paid-from-account=Capital Social - RS
erp.payment.paid-from-currency=EUR
